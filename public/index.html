<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo App - Manage Your Tasks</title>
    <link rel="stylesheet" href="/public/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="container">
        <!-- Header -->
        <header class="header">
            <div class="header-content">
                <h1><i class="fas fa-check-double"></i> Task Master</h1>
                <p>Organize your life, one task at a time</p>
            </div>
        </header>

        <!-- Main Content -->
        <main class="main-content">
            <!-- Input Section -->
            <section class="input-section">
                <div class="input-group">
                    <input 
                        type="text" 
                        id="todoTitle" 
                        class="input-title" 
                        placeholder="What needs to be done?"
                        autocomplete="off"
                    >
                    <input 
                        type="text" 
                        id="todoDescription" 
                        class="input-description" 
                        placeholder="Add a description (optional)"
                        autocomplete="off"
                    >
                    <div class="input-controls">
                        <select id="todoPriority" class="priority-select">
                            <option value="low">Low Priority</option>
                            <option value="medium" selected>Medium Priority</option>
                            <option value="high">High Priority</option>
                        </select>
                        <select id="todoCategory" class="category-select">
                            <option value="personal" selected>Personal</option>
                            <option value="work">Work</option>
                            <option value="shopping">Shopping</option>
                            <option value="health">Health</option>
                            <option value="other">Other</option>
                        </select>
                        <input 
                            type="date" 
                            id="todoDueDate" 
                            class="due-date-input"
                        >
                        <button id="addBtn" class="btn-add">
                            <i class="fas fa-plus"></i> Add Task
                        </button>
                    </div>
                </div>
            </section>

            <!-- Stats Section -->
            <section class="stats-section">
                <div class="stat-card">
                    <i class="fas fa-tasks"></i>
                    <div>
                        <p class="stat-label">Total Tasks</p>
                        <p class="stat-value" id="totalTasks">0</p>
                    </div>
                </div>
                <div class="stat-card">
                    <i class="fas fa-check-circle"></i>
                    <div>
                        <p class="stat-label">Completed</p>
                        <p class="stat-value" id="completedTasks">0</p>
                    </div>
                </div>
                <div class="stat-card">
                    <i class="fas fa-circle"></i>
                    <div>
                        <p class="stat-label">Remaining</p>
                        <p class="stat-value" id="remainingTasks">0</p>
                    </div>
                </div>
            </section>

            <!-- Filter Section -->
            <section class="filter-section">
                <button class="filter-btn active" data-filter="all">
                    <i class="fas fa-list"></i> All
                </button>
                <button class="filter-btn" data-filter="active">
                    <i class="fas fa-spinner"></i> Active
                </button>
                <button class="filter-btn" data-filter="completed">
                    <i class="fas fa-check"></i> Completed
                </button>
                <button class="filter-btn" data-filter="high">
                    <i class="fas fa-fire"></i> High Priority
                </button>
                <button class="filter-btn" data-filter="work">
                    <i class="fas fa-briefcase"></i> Work
                </button>
            </section>

            <!-- Todo List Section -->
            <section class="todos-section">
                <div id="todosList" class="todos-list">
                    <!-- Todos will be dynamically added here -->
                </div>
                <div id="emptyState" class="empty-state">
                    <i class="fas fa-inbox"></i>
                    <h3>No tasks yet</h3>
                    <p>Add a new task to get started!</p>
                </div>
            </section>
        </main>
    </div>

    <script src="/public/app.js"></script>
</body>
</html>
